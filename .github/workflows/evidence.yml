name: historical-evidence

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run complete E2E evidence pipeline
        run: PYTHONPATH=src python scripts/run_end_to_end.py
      - name: Verify evidence artifacts
        run: |
          test -s evidence/e2e/report.json
          test -s evidence/e2e/summary.json
          test -s evidence/e2e/prediction_ledger.jsonl
          test -s evidence/e2e/predictions.csv
      - name: Upload complete evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: sports-intelligence-e2e-evidence
          path: evidence/e2e/
          if-no-files-found: error
