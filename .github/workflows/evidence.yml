name: historical-evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run historical evidence
        run: PYTHONPATH=src python scripts/run_historical_evidence.py
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-evidence
          path: evidence/historical/football_data_e0.json
          if-no-files-found: error
